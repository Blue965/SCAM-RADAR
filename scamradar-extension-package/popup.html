<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScamRadar</title>
    <style>
      :root {
        --bg: #08111f;
        --panel: #0f1b2d;
        --panel-strong: #132338;
        --line: rgba(148, 163, 184, 0.18);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --safe: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        width: 330px;
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(180deg, #091321 0%, #0f172a 100%);
        color: var(--text);
      }

      .header {
        background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
        padding: 16px 18px;
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
      }

      .content {
        padding: 18px 16px 18px;
      }

      .status-card {
        background: rgba(19, 35, 56, 0.8);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 14px 14px;
        text-align: center;
      }

      .shield {
        width: 56px;
        height: 56px;
        margin: 0 auto 12px;
        display: grid;
        place-items: center;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 16px;
        font-size: 28px;
      }

      .risk-badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .risk-safe {
        background: rgba(34, 197, 94, 0.12);
        color: var(--safe);
        border: 1px solid rgba(34, 197, 94, 0.25);
      }

      .risk-warn {
        background: rgba(239, 68, 68, 0.12);
        color: var(--danger);
        border: 1px solid rgba(239, 68, 68, 0.25);
      }

      #status {
        margin: 12px 0 8px;
        font-size: 1.05rem;
        font-weight: 700;
      }

      #detail {
        margin: 0;
        min-height: 32px;
        font-size: 0.72rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .stats {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 16px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.8rem;
      }

      #blocked-count {
        color: var(--accent);
        font-weight: 800;
        font-size: 1rem;
      }

      .btn-scan {
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
        color: #fff;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-scan:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(14, 165, 233, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="header">ScamRadar</div>

    <div class="content">
      <div class="status-card">
        <div class="shield">🛡️</div>
        <span id="risk-badge" class="risk-badge risk-safe">Protection</span>
        <div id="status">Vérification en cours…</div>
        <p id="detail">Analyse de la page active.</p>
      </div>

      <div class="stats">
        <span>Menaces signalées</span>
        <strong id="blocked-count">0</strong>
      </div>

      <button id="scan-btn" class="btn-scan">Analyser la page</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
